<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CivicAgent</title><style>body{font-family:system-ui;margin:0;background:#f5f7f9;color:#18212b}main{max-width:760px;margin:auto;padding:24px}section{background:white;border:1px solid #dbe2e8;border-radius:8px;padding:20px;margin-top:16px}.row{display:flex;gap:8px}input{flex:1;padding:12px;border:1px solid #b8c3cc;border-radius:6px}button{padding:12px 16px;border:0;border-radius:6px;background:#1769aa;color:#fff;font-weight:600}.field{padding:8px 0;border-bottom:1px solid #edf0f2}.muted{color:#687582}</style></head><body><main><h1>CivicAgent</h1><p class="muted">Report a civic issue in plain language. Demo data only.</p><section id="chat"></section><section><div class="row"><input id="input" placeholder="e.g. There is a pothole near JNTU Metro"><button id="send">Send</button></div></section><section id="fields"></section></main><script>let sid;const chat=document.querySelector('#chat'),fields=document.querySelector('#fields');function render(d){chat.innerHTML+='<p><b>CivicAgent:</b> '+(d.message||'What civic issue can I help you report?')+'</p>';fields.innerHTML='<h2>'+((d.service&&d.service.name)||'Your details')+'</h2>'+(d.fields||[]).map(f=>'<div class="field"><b>'+f.id+'</b>: '+(f.value||'<span class="muted">Needed</span>')+'</div>').join('')+(d.review_ready?'<button onclick="confirmIt()">Confirm submission</button>':'');}async function start(){const r=await fetch('http://localhost:8000/api/session',{method:'POST'});sid=(await r.json()).session_id;render({});}async function send(){const message=input.value;if(!message)return;chat.innerHTML+='<p><b>You:</b> '+message+'</p>';input.value='';const r=await fetch('http://localhost:8000/api/session/'+sid+'/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});render(await r.json());}async function confirmIt(){const r=await fetch('http://localhost:8000/api/session/'+sid+'/confirm',{method:'POST'});const d=await r.json();render({message:'Submitted successfully. Reference: '+d.receipt.reference});}send.onclick=send;input.onkeydown=e=>e.key==='Enter'&&send();start();</script></body></html>
